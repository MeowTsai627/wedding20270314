<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7f2">
<title>婚禮備忘錄｜把重要的日子，慢慢準備好</title>
<style>
:root{--ink:#302b29;--muted:#8c817b;--rose:#b96e70;--rose-dark:#98575a;--rose-pale:#f6e8e5;--cream:#fbf7f2;--paper:#fffdfa;--line:#eee5dd;--green:#718676;--shadow:0 18px 50px #533e3012}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:28px 28px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 0 23px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-family:Georgia,serif;font-size:17px;letter-spacing:.1em}.brand-mark{width:34px;height:34px;border:1px solid #d8b8ad;border-radius:50%;display:grid;place-items:center;color:var(--rose);font-size:18px}.today{font-size:12px;color:var(--muted);letter-spacing:.06em}.hero{position:relative;overflow:hidden;background:linear-gradient(110deg,#f4e4df 0%,#f8eee8 47%,#f6ede5 100%);border-radius:20px;margin:28px 0 25px;padding:43px 48px;min-height:230px}.hero:after{content:"❀";position:absolute;right:8%;top:-45px;color:#d8b9aa;opacity:.42;font-size:240px;line-height:1;font-family:Georgia;transform:rotate(-14deg)}.hero-copy{position:relative;z-index:1;max-width:580px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose-dark);margin-bottom:12px}.hero h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:36px;font-weight:500;letter-spacing:.08em;margin:0 0 12px}.hero p{color:#766b65;font-size:14px;line-height:1.9;margin:0}.countdown{position:absolute;z-index:1;right:48px;bottom:35px;text-align:center;color:#80625b}.countdown strong{display:block;font-family:Georgia,serif;font-size:39px;font-weight:400;line-height:1}.countdown span{font-size:11px;letter-spacing:.15em}.dashboard{display:grid;grid-template-columns:1.55fr .85fr;gap:22px}.card{background:var(--paper);border:1px solid #f1e9e2;border-radius:16px;box-shadow:var(--shadow)}.tasks-card{padding:25px 26px 20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.section-title{font-size:17px;font-weight:600;letter-spacing:.04em}.section-sub{font-size:11px;color:var(--muted);margin-top:4px}.progress-label{font-size:11px;color:var(--muted);text-align:right}.progress-label b{color:var(--rose-dark);font-size:13px}.progress-track{height:5px;background:#f2eae5;border-radius:99px;margin:0 0 21px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#c17d78,#dcaaa0);border-radius:inherit;transition:width .3s}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:15px}.filter{border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;font-size:12px}.filter.active{background:var(--rose-pale);color:var(--rose-dark);font-weight:600}.toolbar-spacer{flex:1}.sort-select{border:1px solid var(--line);background:white;color:#746963;border-radius:8px;padding:7px 9px;font-size:11px;outline:none}.task-list{display:flex;flex-direction:column}.task{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:center;padding:13px 3px;border-bottom:1px solid #f3ede8;animation:in .2s ease}.task:last-child{border-bottom:0}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.check{width:19px;height:19px;border:1.5px solid #d9c9c0;border-radius:50%;background:white;display:grid;place-items:center;color:white;padding:0}.task.done .check{background:var(--green);border-color:var(--green)}.check svg{width:11px;height:11px}.task-title{font-size:13px;line-height:1.55}.task.done .task-title{text-decoration:line-through;color:#aaa19b}.task-meta{display:flex;gap:7px;align-items:center;margin-top:4px}.tag{font-size:10px;padding:3px 7px;border-radius:5px;background:#f7f0eb;color:#8f786b}.tag.priority{background:#f9e8e5;color:#a7615e}.task-date{font-size:10px;color:#9c918a}.delete{border:0;background:none;color:#b8aaa2;font-size:17px;padding:4px 7px;opacity:0;transition:.15s}.task:hover .delete,.delete:focus{opacity:1}.delete:hover{color:#aa5557}.empty{padding:37px 12px;text-align:center;color:var(--muted);font-size:13px}.empty-icon{font-size:28px;color:#d9b4a8;margin-bottom:9px}.add-row{display:flex;gap:9px;margin-top:15px;padding-top:17px;border-top:1px solid var(--line)}.add-input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;font-size:12px;outline:none;transition:border .2s}.add-input:focus{border-color:#d4a09a}.add-input::placeholder{color:#b6aaa2}.add-category{width:100px;border:1px solid var(--line);background:white;border-radius:9px;padding:0 9px;font-size:11px;color:#766b65;outline:none}.add-button{border:0;background:var(--rose);color:white;border-radius:9px;padding:0 17px;font-size:12px;white-space:nowrap;transition:.2s}.add-button:hover{background:var(--rose-dark);transform:translateY(-1px)}.side{display:flex;flex-direction:column;gap:17px}.mini-card{padding:22px 23px}.mini-title{font-size:14px;font-weight:600;margin-bottom:15px}.milestone{display:flex;gap:12px;align-items:flex-start}.milestone-icon{width:33px;height:33px;border-radius:10px;background:#f8eae6;display:grid;place-items:center;color:var(--rose);font-size:15px;flex:none}.milestone label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.date-input{border:0;border-bottom:1px solid var(--line);background:transparent;color:#554a45;padding:4px 0;font-size:12px;outline:none;width:145px}.date-input:focus{border-color:var(--rose)}.date-note{font-size:10px;color:#a39790;margin-top:9px;line-height:1.6}.quote{padding:20px 23px;background:#f2eee7;border:0}.quote-mark{font-family:Georgia,serif;color:#bd8c7d;font-size:29px;line-height:.8}.quote p{font-family:"Noto Serif TC","Songti TC",serif;font-size:13px;line-height:1.9;color:#76675f;margin:8px 0 0}.quote small{font-size:10px;color:#a0948b}.category-card{padding:21px 23px}.category-list{display:flex;flex-wrap:wrap;gap:8px}.category-chip{display:flex;align-items:center;gap:7px;padding:7px 9px;background:#faf6f1;border-radius:7px;color:#766b65;font-size:10px}.category-chip i{width:6px;height:6px;border-radius:50%;background:#c58b7d}.category-chip:nth-child(2) i{background:#8c9b83}.category-chip:nth-child(3) i{background:#c5a56f}.category-chip:nth-child(4) i{background:#9d8ab4}.footer{text-align:center;margin-top:25px;font-family:Georgia,serif;font-size:10px;letter-spacing:.16em;color:#b2a69e}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#39312e;color:white;padding:10px 16px;border-radius:9px;font-size:12px;pointer-events:none;transition:.25s;box-shadow:0 6px 20px #0002}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.shell{padding:18px 15px 45px}.topbar{padding-bottom:17px}.hero{padding:33px 25px;min-height:235px;margin-top:19px}.hero h1{font-size:29px}.hero p{max-width:310px;font-size:13px}.hero:after{right:-16px;top:35px;font-size:155px;opacity:.26}.countdown{right:25px;bottom:22px}.countdown strong{font-size:31px}.dashboard{grid-template-columns:1fr;gap:15px}.tasks-card{padding:21px 17px 17px}.mini-card{padding:19px}.side{display:grid;grid-template-columns:1fr 1fr}.side .quote{grid-column:1/-1;grid-row:1}.add-row{flex-wrap:wrap}.add-input{flex-basis:calc(100% - 110px)}.add-category{flex:1;height:40px}.add-button{height:40px}.task-title{font-size:12px}.delete{opacity:1}}@media(max-width:420px){.side{grid-template-columns:1fr}.side .quote{grid-column:auto}.hero:after{right:-45px}.today{font-size:10px}.toolbar{gap:2px}.filter{padding:7px 8px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">♡</span><span>OUR WEDDING NOTES</span></div><div class="today" id="today"></div></header>
  <section class="hero"><div class="hero-copy"><div class="eyebrow">A little note for our big day</div><h1>把重要的日子，慢慢準備好。</h1><p>每一個小小的完成，都是走向幸福的一步。<br>把待辦交給備忘錄，把期待留給彼此。</p></div><div class="countdown"><strong id="daysLeft">—</strong><span>天後，迎接我們的大日子</span></div></section>
  <main class="dashboard">
    <section class="card tasks-card"><div class="section-head"><div><div class="section-title">婚禮待辦清單</div><div class="section-sub">一步一步，讓心意成真</div></div><div class="progress-label">完成進度　<b id="progressText">0%</b></div></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="toolbar"><button class="filter active" data-filter="all">全部 <span id="allCount"></span></button><button class="filter" data-filter="active">待完成 <span id="activeCount"></span></button><button class="filter" data-filter="done">已完成 <span id="doneCount"></span></button><span class="toolbar-spacer"></span><select class="sort-select" id="sortSelect" aria-label="排序"><option value="default">預設排序</option><option value="date">依日期排序</option></select></div>
      <div class="task-list" id="taskList"></div>
      <form class="add-row" id="addForm"><input class="add-input" id="taskInput" maxlength="80" placeholder="新增一件婚禮待辦…" aria-label="新增待辦事項" required><select class="add-category" id="categoryInput" aria-label="選擇分類"><option>場地佈置</option><option>婚紗造型</option><option>婚宴餐飲</option><option>其他事項</option></select><button class="add-button" type="submit">＋ 新增</button></form>
    </section>
    <aside class="side"><section class="card mini-card"><div class="mini-title">我們的大日子</div><div class="milestone"><div class="milestone-icon">♡</div><div><label for="weddingDate">婚禮日期</label><input class="date-input" type="date" id="weddingDate"><div class="date-note">設定日期，看看還有幾天相見。</div></div></div></section><section class="card quote"><div class="quote-mark">“</div><p>最好的婚禮，不是最盛大的那一場，<br>而是每個細節裡都有我們的模樣。</p><small>給正在準備婚禮的你們</small></section><section class="card category-card"><div class="mini-title">待辦分類</div><div class="category-list"><span class="category-chip"><i></i>場地佈置</span><span class="category-chip"><i></i>婚紗造型</span><span class="category-chip"><i></i>婚宴餐飲</span><span class="category-chip"><i></i>其他事項</span></div></section></aside>
  </main><footer class="footer">MADE WITH LOVE · JUST FOR THE TWO OF YOU</footer>
</div><div class="toast" id="toast"></div>
<script>
const starterTasks=[
 {id:1,title:'確認婚宴場地與桌數',category:'場地佈置',date:'2026-11-15',done:false,priority:true},
 {id:2,title:'挑選婚紗與拍攝日期',category:'婚紗造型',date:'2026-11-22',done:false,priority:true},
 {id:3,title:'完成喜帖設計與寄送名單',category:'其他事項',date:'2026-12-01',done:false,priority:false},
 {id:4,title:'試菜並確認婚宴菜單',category:'婚宴餐飲',date:'2026-12-10',done:false,priority:false},
 {id:5,title:'預約新秘與婚禮造型試妝',category:'婚紗造型',date:'2026-12-18',done:false,priority:false},
 {id:6,title:'挑選婚禮音樂與進場歌曲',category:'其他事項',date:'2026-12-24',done:true,priority:false}
];
const STORE='weddingMemoTasks_v1', DATE_STORE='weddingMemoDate_v1';let tasks;try{const saved=JSON.parse(localStorage.getItem(STORE));tasks=Array.isArray(saved)?saved:starterTasks}catch{tasks=starterTasks}let filter='all',sort='default';
const $=s=>document.querySelector(s);const fmtDate=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`};function persist(){localStorage.setItem(STORE,JSON.stringify(tasks))}function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1900)}
function updateDate(){const d=$('#weddingDate').value;if(!d){$('#daysLeft').textContent='—';return}const diff=Math.ceil((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/86400000);$('#daysLeft').textContent=diff<0?'♡':diff;$('#daysLeft').parentElement.querySelector('span').textContent=diff<0?'我們的大日子已經到來':'天後，迎接我們的大日子'}
function render(){const list=$('#taskList');let visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));if(sort==='date')visible=[...visible].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));list.innerHTML='';if(!visible.length){list.innerHTML='<div class="empty"><div class="empty-icon">✿</div>這裡暫時沒有事項，新增一件小事吧。</div>'}for(const t of visible){const row=document.createElement('div');row.className='task'+(t.done?' done':'');row.innerHTML=`<button class="check" aria-label="${t.done?'標記未完成':'標記完成'}" data-action="toggle" data-id="${t.id}">${t.done?'<svg viewBox="0 0 16 16" fill="none"><path d="m3 8 3.2 3.2L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</button><div><div class="task-title"></div><div class="task-meta"><span class="tag ${t.priority&&!t.done?'priority':''}"></span><span class="task-date">${t.date?'期限 '+fmtDate(t.date):''}</span></div></div><button class="delete" aria-label="刪除事項" title="刪除" data-action="delete" data-id="${t.id}">×</button>`;row.querySelector('.task-title').textContent=t.title;row.querySelector('.tag').textContent=t.category;list.append(row)}const done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;$('#progressText').textContent=pct+'%';$('#progressFill').style.width=pct+'%';$('#allCount').textContent=tasks.length;$('#doneCount').textContent=done;$('#activeCount').textContent=total-done}
$('#taskList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id);if(b.dataset.action==='toggle'){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);persist();render();toast('已更新完成狀態')}else{tasks=tasks.filter(t=>t.id!==id);persist();render();toast('已刪除待辦事項')}});
$('#addForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#taskInput'),title=input.value.trim();if(!title)return;tasks.unshift({id:Date.now(),title,category:$('#categoryInput').value,date:'',done:false,priority:false});persist();input.value='';filter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render();toast('已加入待辦清單')});document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));$('#sortSelect').addEventListener('change',e=>{sort=e.target.value;render()});$('#weddingDate').value=localStorage.getItem(DATE_STORE)||'';$('#weddingDate').addEventListener('change',e=>{localStorage.setItem(DATE_STORE,e.target.value);updateDate();toast('已更新婚禮日期')});const now=new Date();$('#today').textContent=`${now.getFullYear()} · ${String(now.getMonth()+1).padStart(2,'0')} · ${String(now.getDate()).padStart(2,'0')}`;updateDate();render();
</script>
</body>
</html>
